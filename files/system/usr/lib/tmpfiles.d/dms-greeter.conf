# dms-greeter reads its config from /var/cache/dms-greeter (DMS_GREET_CFG_DIR).
#
# `C+` (force-copy) rather than `C` (copy-if-missing): /var is machine-local and
# survives image updates, so with plain `C` the very first boot would freeze the
# greeter theme forever and later changes in this repo would never reach an
# installed system.
#
# Trade-off: this makes the image the single source of truth, so `dms-greeter
# sync` results are overwritten on every boot. If you would rather configure the
# greeter from a running system, change `C+` back to `C` and re-run the sync.
#
# Type  Path                                  Mode  User     Group    Age  Argument
d       /var/cache/dms-greeter                0755  greeter  greeter  -    -
C+      /var/cache/dms-greeter/settings.json  0644  greeter  greeter  -    /usr/share/dms-greeter-theme/settings.json
C+      /var/cache/dms-greeter/session.json   0644  greeter  greeter  -    /usr/share/dms-greeter-theme/session.json
#C+      /var/cache/dms-greeter/colors.json    0644  greeter  greeter  -    /usr/share/dms-greeter-theme/colors.json

# Greeter wallpaper. dms-greeter only ever loads the override image from this
# exact filename -- `greeterWallpaperPath` in settings.json is just a non-empty
# flag that enables it, not the path that gets read. To use one, drop a JPEG at
# files/system/usr/share/dms-greeter-theme/wallpaper.jpg, uncomment the line
# below, and set greeterWallpaperPath to any non-empty string.
#C+      /var/cache/dms-greeter/greeter_wallpaper_override.jpg  0644  greeter  greeter  -  /usr/share/dms-greeter-theme/wallpaper.jpg
